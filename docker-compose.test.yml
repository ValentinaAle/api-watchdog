name: api-watchdog-test

services:
  postgres-test:
    image: postgres:17-alpine
    env_file:
      - .env.test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test_network

volumes:
  postgres_test_data:
    name: api-watchdog-test-postgres-data

networks:
  test_network:
    name: api-watchdog-test-network
