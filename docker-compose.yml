services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    command: pnpm --filter @api-watchdog/web dev
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/workspace
      - app_node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.process
      args:
        PACKAGE: "@api-watchdog/monitor-worker"
        TARGET_DIR: "monitor-worker"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.process
      args:
        PACKAGE: "@api-watchdog/scheduler"
        TARGET_DIR: "scheduler"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: api_watchdog
      POSTGRES_USER: watchdog
      POSTGRES_PASSWORD: watchdog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdog -d api_watchdog"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
  app_node_modules:
